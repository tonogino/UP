l_simp_chinese:
 UP_GER_focus_Kaiserliches_Nachfolgeproblem: "帝国继承问题"
 UP_GER_focus_Kaiserliches_Nachfolgeproblem_desc: "威廉二世的时代正在结束。帝国不能等到皇座空悬、军官团与议会各自拥立候选人之后，才开始讨论继承问题。德国必须现在决定，谁有资格接过胜利者留下的沉重遗产。"

 UP_GER_Eastern_Problem: "东方问题"
 UP_GER_Eastern_Problem_desc: "波兰、乌克兰与波罗的海保护国既是德国胜利的成果，也是帝国压力最大的来源。柏林必须决定东方体系究竟是一道边境屏障、一个共同市场，还是等待爆炸的火药桶。"
 UP_GER_Russian_Problem: "俄国问题"
 UP_GER_Russian_Problem_desc: "俄罗斯帝国虽然已经崩溃，但俄罗斯并没有消失。分裂的继承政权终有一日会重新争夺莫斯科，而任何统一者都会将德国视为肢解俄国的首要仇敌。"
 UP_GER_Franch_Problem: "法国问题"
 UP_GER_Franch_Problem_desc: "法国签署了和平，却从未接受战败。它的军队、殖民帝国和复仇政治仍然存在。德国必须决定是迫使巴黎最终屈服，还是为欧洲寻找一种不会通向新战争的安排。"
 UP_GER_Britanian_Problem: "不列颠问题"
 UP_GER_Britanian_Problem_desc: "英国没有输掉大战，也不会自动接受德国永久统治大陆。海军、贸易与全球金融构成了伦敦的制衡工具，英德关系将决定下一场欧洲战争是否会真正成为世界大战。"

 UP_GER_hohenzollern_legitimacy: "霍亨索伦的合法性"
 UP_GER_hohenzollern_legitimacy_desc: "王朝继承不仅需要血统，还需要诸邦、议会、军队与保护国承认。只有证明旧王朝仍能处理新时代的问题，霍亨索伦的合法性才不会沦为空洞礼仪。"
 UP_GER_appease_prussian_officer_corps: "安抚普鲁士军官团"
 UP_GER_appease_prussian_officer_corps_desc: "军官团将自己视为1918年胜利的真正缔造者。新皇帝必须给予他们荣誉和地位，同时阻止总参谋部再次成为国家之上的国家。"
 UP_GER_reichstag_compromise: "与帝国议会妥协"
 UP_GER_reichstag_compromise_desc: "帝国议会不会再满足于批准宫廷已经作出的决定。一份谨慎的宪政妥协能够为王朝赢得喘息，也可能永久改变皇帝与人民之间的关系。"
 UP_GER_guardian_of_hague_system: "海牙体系的守护者"
 UP_GER_guardian_of_hague_system_desc: "德国不能只做海牙体系的受益者。它必须证明自己有能力保护成员、仲裁争端并承担秩序的代价，才能让霸权获得某种正当性。"
 UP_GER_kaisers_new_empire: "皇帝的新帝国"
 UP_GER_kaisers_new_empire_desc: "王朝、军队、议会与大陆体系已经达成新的平衡。这个帝国仍属于霍亨索伦，却不再只是威廉二世时代遗留下来的旧机器。"

 UP_GER_new_imperial_architecture: "新帝国建筑学"
 UP_GER_new_imperial_architecture_desc: "阿尔德夫·希特纳相信政治首先是一种空间艺术。车站、广场、纪念碑和政府大楼应当让每一个德国人直观地感受到国家的力量与新时代的到来。"
 UP_GER_aesthetics_of_mass_mobilization: "大众动员美学"
 UP_GER_aesthetics_of_mass_mobilization_desc: "旗帜、灯光、广播、制服与整齐的人群可以共同构成一种新的政治语言。个人将在宏大的集体仪式中理解自己属于何种帝国。"
 UP_GER_break_old_prussian_arrogance: "击碎旧普鲁士的傲慢"
 UP_GER_break_old_prussian_arrogance_desc: "旧军官团把帝国视为普鲁士军营的延伸。希特纳的新国家不会允许世袭军人和容克贵族继续垄断德国的荣誉、军队与未来。"
 UP_GER_imperial_works_directorate: "帝国工程总署"
 UP_GER_imperial_works_directorate_desc: "铁路、城市、军工区和纪念建筑将由统一机构规划。工程总署既是建设机关，也是把希特纳的设计变成国家现实的政治机器。"
 UP_GER_architect_of_new_order: "新秩序的建筑师"
 UP_GER_architect_of_new_order_desc: "旧帝国已经被重新绘制。阿尔德夫·希特纳不再只是来自奥地利的建筑师，而成为一个以动员、工程和政治美学塑造整个欧洲秩序的人。"

 UP_GER_task_condition_pending_tt: "§R该任务的完成条件尚未接入对应问题板块。§!"

 up_germany.1.t: "谁来继承帝国？"
 up_germany.1.d: "威廉二世的健康已经无法继续被宫廷公报掩饰。按照王朝法律，霍亨索伦家族拥有无可置疑的继承权，普鲁士军官团与多数旧贵族也不会接受其他答案。\n\n然而，战后的德国已经产生了另一种政治力量。来自奥地利的年轻建筑师阿尔德夫·希特纳因参与维也纳重建、帝国纪念工程和群众集会设计而声名鹊起。他宣称德国需要的不是一位继承旧宫殿的人，而是一位敢于重新设计整个帝国的人。工业界的激进派、青年组织和一部分厌恶旧普鲁士集团的官员正在支持他。\n\n这不再只是一个王位继承问题。德国正在选择自己将以何种面貌进入新时代。"
 up_germany.1.a: "帝国属于霍亨索伦。"
 up_germany.1.b: "让阿尔德夫·希特纳设计一个新帝国。"
