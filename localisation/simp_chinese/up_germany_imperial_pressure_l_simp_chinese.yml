l_simp_chinese:
 UP_GER_imperial_pressure_decisions: "帝国压力"
 UP_GER_imperial_pressure_decisions_desc: "§Y当前帝国压力：[?UP_GER_imperial_pressure|1]/100§!\n§R帝国压力每月增长0.2。§!\n\n帝国压力代表东方驻军、保护国补贴、跨国铁路、外交保证以及维持海牙体系所消耗的政治与经济资源。国策、战争和附属国危机可以进一步改变压力。\n\n§G0—19：秩序稳固§!\n§Y20—39：体系紧绷§!\n§O40—59：帝国过载§!\n§R60—79：附属体系动摇§!\n§R80—100：霸权危机§!"
 UP_GER_imperial_pressure_status: "帝国压力报告：[?UP_GER_imperial_pressure|1]/100"
 UP_GER_imperial_pressure_status_desc: "柏林各部委将驻军、贷款、保护国稳定和外交承诺汇总为帝国压力。数值越高，德国为维持大陆霸权付出的国内代价就越严重。"
 UP_GER_convene_hague_financial_council: "召开海牙财政会议"
 UP_GER_convene_hague_financial_council_desc: "召集德国银行、保护国代表和帝国财政官员，对重复补贴与低效项目进行紧急审计。"
 UP_GER_issue_eastern_consolidation_bonds: "发行东方统合债券"
 UP_GER_issue_eastern_consolidation_bonds_desc: "以德国国家信用承担东方体系的短期缺口。这能迅速降低压力，却会在半年内增加国内消费品负担。"
 UP_GER_shift_burden_to_protectorates: "要求保护国分摊负担"
 UP_GER_shift_burden_to_protectorates_desc: "迫使附属政府承担更多驻军、铁路和行政费用。柏林的压力会显著下降，但保护国将获得更强的自治诉求。"
 UP_GER_imperial_pressure_minus_5_tt: "帝国压力：§G-5§!"
 UP_GER_imperial_pressure_minus_10_tt: "帝国压力：§G-10§!"
 UP_GER_imperial_pressure_minus_15_tt: "帝国压力：§G-15§!"
 UP_GER_imperial_pressure_plus_5_tt: "帝国压力：§R+5§!"
 UP_GER_imperial_pressure_plus_10_tt: "帝国压力：§R+10§!"
 UP_GER_imperial_pressure_plus_15_tt: "帝国压力：§R+15§!"
 UP_GER_shifted_imperial_burden: "分摊帝国负担"
