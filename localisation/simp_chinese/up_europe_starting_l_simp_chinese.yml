 UP_GER_hague_system_hegemon: "海牙体系霸主"
 UP_GER_hague_system_hegemon_desc: "德国以胜利者和仲裁者的身份站在海牙体系顶端。保护国提供工业与市场，但欧洲各国也日益将柏林的外交视为霸权命令。"
 UP_GER_eastern_protection_cost: "东方保护成本"
 UP_GER_eastern_protection_cost_desc: "波兰、乌克兰与波罗的海保护国构成了帝国的东方屏障，同时需要驻军、贷款、铁路维护与持续的政治干涉。"
 UP_GER_old_kaisers_shadow: "老皇帝的阴影"
 UP_GER_old_kaisers_shadow_desc: "威廉二世仍然是帝国胜利的象征。他的存在维持着旧秩序，却也使任何触及宫廷、军队和宪法的改革变得格外迟缓。"
 UP_GER_french_revisionism: "法国修正主义"
 UP_GER_french_revisionism_desc: "法国从未接受战后的欧洲秩序。莱茵防线上的工事与驻军提醒着德国人：西方的战争只是被推迟，而非真正结束。"
 UP_GER_british_naval_counterbalance: "英国海权制衡"
 UP_GER_british_naval_counterbalance_desc: "英国虽然在大战中保持中立，却不会容许德国同时支配大陆与海洋。皇家海军和伦敦金融市场正在共同限制德国的世界政策。"
 UP_GER_subject_factory_contribution_tt: "傀儡贡献工厂：§G+5%§!"
 UP_GER_diplomatic_improvement_penalty_tt: "外交关系改善：§R-5%§!"
 UP_GER_subject_resource_trade_cost_tt: "傀儡资源贸易成本：§G-10%§!"
 UP_GER_monthly_imperial_pressure_tt: "帝国压力每月增长：§R+0.2§!"
 UP_GER_subject_system_obligations: "海牙体系附属义务"
 UP_GER_subject_system_obligations_desc: "该隐藏修正确保德国保护国向宗主国提供额外工厂，并降低宗主国取得附属资源的贸易成本。"
 UP_GER_imperial_pressure_controlled: "帝国压力：秩序稳固"
 UP_GER_imperial_pressure_controlled_desc: "柏林目前仍能以财政、驻军和外交手段承担海牙体系的运转成本。"
 UP_GER_imperial_pressure_strained: "帝国压力：体系紧绷"
 UP_GER_imperial_pressure_strained_desc: "东方驻军、附属国补贴与盟友危机开始争夺帝国有限的政治资源。"
 UP_GER_imperial_pressure_overloaded: "帝国压力：帝国过载"
 UP_GER_imperial_pressure_overloaded_desc: "德国已经无法在不影响国内经济的情况下同时满足所有保护国和战略承诺。"
 UP_GER_imperial_pressure_fracturing: "帝国压力：附属体系动摇"
 UP_GER_imperial_pressure_fracturing_desc: "柏林的命令仍然有效，但越来越多的附属政府相信德国已经没有能力惩罚公开的不服从。"
 UP_GER_imperial_pressure_systemic_crisis: "帝国压力：霸权危机"
 UP_GER_imperial_pressure_systemic_crisis_desc: "海牙体系正处于连锁崩溃的边缘。任何一次战争、政变或财政违约都可能摧毁德国的大陆霸权。"
 UP_GER_eastern_consolidation_bonds: "东方统合债券"
 UP_GER_eastern_consolidation_bonds_desc: "帝国通过发行长期债券暂时填补东方体系的财政缺口，但国内资本和工业必须为此承担代价。"

 UP_ENG_glorious_neutrality: "光荣中立"
 UP_ENG_glorious_neutrality_desc: "英国没有参加大陆战争，保存了财富、海军和帝国，却也强化了国内对欧洲战争的排斥。"
 UP_ENG_intact_empire: "完整的帝国"
 UP_ENG_intact_empire_desc: "英国的殖民体系没有遭受大战的全面消耗，帝国贸易依旧维持着伦敦的繁荣。"
 UP_ENG_continental_balance: "大陆均势"
 UP_ENG_continental_balance_desc: "德国的胜利迫使伦敦重新思考传统均势政策，但英国仍不愿轻易作出军事承诺。"

 UP_FRA_alone_in_the_trenches: "孤独的战壕"
 UP_FRA_alone_in_the_trenches_desc: "法国在没有英国和意大利支援的情况下承受了战争，整整一代人的损失至今无法弥补。"
 UP_FRA_imperial_compensation: "帝国补偿论"
 UP_FRA_imperial_compensation_desc: "法国将非洲帝国视为恢复国力、人口和国际地位的最后基础。"
 UP_FRA_unfinished_peace: "未完成的和平"
 UP_FRA_unfinished_peace_desc: "停战结束了炮火，却没有消除法国对德国和阿尔萨斯—洛林问题的执念。"

 UP_ITA_neutrality_dividend: "中立的红利"
 UP_ITA_neutrality_dividend_desc: "意大利避免了大战的人员和工业损失，并从交战双方的贸易中积累了财富。"
 UP_ITA_unfinished_unification: "未完成的统一"
 UP_ITA_unfinished_unification_desc: "特伦蒂诺无法满足民族主义者；的里雅斯特、伊斯特拉和达尔马提亚依然是他们的目标。"
 UP_ITA_between_the_powers: "列强之间"
 UP_ITA_between_the_powers_desc: "罗马试图在柏林、巴黎与伦敦之间周旋，以每一次外交选择换取新的利益。"

 UP_DAN_defeated_common_army: "战败的共同军"
 UP_DAN_defeated_common_army_desc: "塞尔维亚与加利西亚的失败摧毁了共同军的威望，联邦军队仍在德国监督下艰难重建。"
 UP_DAN_vienna_crown_compromise: "维也纳王冠协定"
 UP_DAN_vienna_crown_compromise_desc: "奥地利、匈牙利和波希米亚接受共同皇帝与联邦制度，换取各自的议会和自治权。"
 UP_DAN_german_military_supervision: "德国军事监督"
 UP_DAN_german_military_supervision_desc: "德国顾问控制铁路、兵工厂和总参谋部改革，帮助联邦恢复力量，也限制其独立性。"
 UP_DAN_three_diets_one_emperor: "三个议会，一个皇帝"
 UP_DAN_three_diets_one_emperor_desc: "维也纳、布达佩斯和布拉格都承认卡尔一世，却对联邦的边界、军队和未来争执不休。"

 UP_ILY_zagreb_settlement: "萨格勒布协定"
 UP_ILY_zagreb_settlement_desc: "南斯拉夫王冠领以继续接受哈布斯堡王朝为条件，取得了国际法上的独立。"
 UP_ILY_three_peoples_one_crown: "一个王国，三种忠诚"
 UP_ILY_three_peoples_one_crown_desc: "克罗地亚人、塞族和波斯尼亚穆斯林对国家、王朝和贝尔格莱德抱有不同忠诚。"
 UP_ILY_belgrade_propaganda: "贝尔格莱德的宣传"
 UP_ILY_belgrade_propaganda_desc: "塞尔维亚持续向波斯尼亚和克罗地亚境内的统一派提供资金、武器和宣传材料。"
 UP_ILY_adriatic_question: "亚得里亚海问题"
 UP_ILY_adriatic_question_desc: "意大利、奥匈联邦和伊利里亚都认为亚得里亚海北岸关系到自身安全与民族统一。"

 UP_POL_eastern_barrier: "德国的东方屏障"
 UP_POL_eastern_barrier_desc: "波兰军队的首要任务是保护德国体系免受俄罗斯各政权的重新统一与西进威胁。"
 UP_POL_galician_integration: "整合加利西亚"
 UP_POL_galician_integration_desc: "新获得的加利西亚扩大了波兰领土，也带来了乌克兰人口、土地问题与行政负担。"
 UP_POL_protected_independence: "被保护的独立"
 UP_POL_protected_independence_desc: "德国保证波兰的国家地位，却掌握其外交、军备和重要工业。"

 UP_SER_defended_homeland: "保卫祖国的胜利"
 UP_SER_defended_homeland_desc: "塞尔维亚没有被奥匈征服，军队和人民将这场生存战争视为民族历史上的伟大胜利。"
 UP_SER_lost_macedonia: "失去的马其顿"
 UP_SER_lost_macedonia_desc: "塞尔维亚守住了国家，却在德国停战压力下将马其顿割让给保加利亚。"
 UP_SER_bosnian_dream: "波斯尼亚之梦"
 UP_SER_bosnian_dream_desc: "贝尔格莱德从未放弃将波斯尼亚和所有南斯拉夫民族统一在同一国家中的目标。"

 UP_BUL_third_bulgarian_victory: "第三保加利亚的胜利"
 UP_BUL_third_bulgarian_victory_desc: "马其顿、多布罗加和西色雷斯的获得使保加利亚成为巴尔干战争最大的胜利者。"
 UP_BUL_overextended_borders: "扩张过度"
 UP_BUL_overextended_borders_desc: "新边界带来了荣誉，也带来了敌对人口、漫长边境和难以承受的驻军开支。"
 UP_BUL_berlin_balkan_partner: "柏林的巴尔干伙伴"
 UP_BUL_berlin_balkan_partner_desc: "德国将保加利亚视为巴尔干最可靠的军事伙伴，并持续提供装备和顾问。"

 UP_ROM_bucharest_humiliation: "布加勒斯特的耻辱"
 UP_ROM_bucharest_humiliation_desc: "战败条约夺走了罗马尼亚大片领土，军队、王室和政党都在寻找替罪者。"
 UP_ROM_mutilated_kingdom: "残缺的王国"
 UP_ROM_mutilated_kingdom_desc: "多布罗加、特兰西瓦尼亚、克里沙纳、巴纳特和布科维纳的丧失削弱了国家经济与人口。"
 UP_ROM_german_enforced_peace: "德国扶植的和平"
 UP_ROM_german_enforced_peace_desc: "柏林保证罗马尼亚残余领土，同时阻止其立即向奥匈联邦和保加利亚复仇。"

 UP_TUR_fragile_victor: "虚弱的胜利者"
 UP_TUR_fragile_victor_desc: "奥斯曼帝国保住了领土，却没有解决财政、军队和民族问题。"
 UP_TUR_german_concessions: "德国经济特权"
 UP_TUR_german_concessions_desc: "德国资本修建铁路、开发石油并重建军队，也逐渐控制帝国的经济命脉。"
 UP_TUR_arab_provinces: "阿拉伯诸省"
 UP_TUR_arab_provinces_desc: "叙利亚、巴勒斯坦和美索不达米亚仍属于帝国，但地方自治与阿拉伯民族主义日益强大。"
