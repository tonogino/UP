l_english:
 UP_germany_focus: "German Imperial Focus Tree"
 UP_GER_the_incomplete_victory: "The Old Kaiser's Shadow"
 UP_GER_the_incomplete_victory_desc: "Wilhelm II remains the living symbol of Germany's victorious age, but his era is drawing to a close. The eastern protectorates, French revisionism, British counterbalance and the return of Russian power demand an answer from Berlin."
 UP_GER_focus_Kaiserliches_Nachfolgeproblem: "The Imperial Succession"
 UP_GER_focus_Kaiserliches_Nachfolgeproblem_desc: "The Empire cannot wait for an empty throne to begin debating who should inherit the victory—and the burdens—of Wilhelm II."

 UP_GER_Eastern_Problem: "östlichen Schutzsystems"
 UP_GER_Eastern_Problem_desc: "Poland, Ukraine and the Baltic protectorates are both the greatest prize of Germany's victory and the greatest source of imperial pressure."
 UP_GER_Russian_Problem: "The Russian Question"
 UP_GER_Russian_Problem_desc: "The Russian Empire has collapsed, but Russia has not disappeared. Any future unifier will regard Germany as the chief author of Russia's dismemberment."
 UP_GER_Franch_Problem: "The French Question"
 UP_GER_Franch_Problem_desc: "France signed the peace but never accepted defeat. Berlin must decide whether Paris can be reconciled, contained or finally broken."
 UP_GER_Britanian_Problem: "The British Question"
 UP_GER_Britanian_Problem_desc: "Britain did not lose the Great War and will not automatically accept permanent German mastery of the continent."

 UP_GER_hohenzollern_legitimacy: "Hohenzollern Legitimacy"
 UP_GER_hohenzollern_legitimacy_desc: "Dynastic blood alone will not secure the throne. The states, the Reichstag, the army and the protectorates must all recognize the continuing legitimacy of the Hohenzollerns."
 UP_GER_appease_prussian_officer_corps: "Appease the Prussian Officer Corps"
 UP_GER_appease_prussian_officer_corps_desc: "The officer corps regards itself as the true author of victory. The new Kaiser must preserve its honor without allowing the General Staff to become a state above the state."
 UP_GER_reichstag_compromise: "Compromise with the Reichstag"
 UP_GER_reichstag_compromise_desc: "The Reichstag will no longer be satisfied with approving decisions already made by the court. A careful constitutional settlement may preserve the dynasty."
 UP_GER_guardian_of_hague_system: "Guardian of the Hague System"
 UP_GER_guardian_of_hague_system_desc: "Germany must prove that it can protect the members of its order, arbitrate their disputes and bear the costs of continental leadership."
 UP_GER_kaisers_new_empire: "The Kaiser's New Empire"
 UP_GER_kaisers_new_empire_desc: "Dynasty, army, parliament and continental order have reached a new balance. The Hohenzollern Empire has outlived the age that created it."

 UP_GER_new_imperial_architecture: "A New Imperial Architecture"
 UP_GER_new_imperial_architecture_desc: "Aldeff Hitner believes that politics is first an art of space. Stations, squares, monuments and ministries must make the power of the new state visible."
 UP_GER_aesthetics_of_mass_mobilization: "The Aesthetics of Mass Mobilization"
 UP_GER_aesthetics_of_mass_mobilization_desc: "Flags, light, radio, uniforms and ordered crowds will become the visual language of a permanently mobilized empire."
 UP_GER_break_old_prussian_arrogance: "Break Old Prussian Arrogance"
 UP_GER_break_old_prussian_arrogance_desc: "The hereditary officers and Junkers have treated Germany as an extension of their barracks for long enough. Their monopoly over honor and power must end."
 UP_GER_imperial_works_directorate: "Imperial Works Directorate"
 UP_GER_imperial_works_directorate_desc: "Railways, cities, industrial regions and monuments will be planned by a single directorate capable of turning Hitner's designs into political reality."
 UP_GER_architect_of_new_order: "Architect of the New Order"
 UP_GER_architect_of_new_order_desc: "Aldeff Hitner is no longer merely an Austrian architect. He has become the designer of a new German state and a new European order."

 UP_GER_task_condition_pending_tt: "§RThis mission is locked until its condition is connected to the corresponding foreign-policy branch.§!"

 up_germany.1.t: "Who Will Inherit the Empire?"
 up_germany.1.d: "Wilhelm II's failing health can no longer be concealed by court communiqués. Dynastic law favors the Hohenzollerns, backed by the Prussian officer corps and the old nobility.\n\nYet postwar Germany has produced another political force. Aldeff Hitner, a young Austrian architect celebrated for reconstruction plans, imperial monuments and mass spectacles, argues that Germany needs not a caretaker of the old palace but an architect prepared to redesign the entire Empire. Radical industrialists, youth organizations and officials hostile to the old Prussian establishment have rallied to him.\n\nGermany is choosing more than an heir. It is choosing the form in which it will enter a new age."
 up_germany.1.a: "The Empire belongs to the Hohenzollerns."
 up_germany.1.b: "Let Aldeff Hitner design a new Empire."
